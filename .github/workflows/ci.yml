name: CI
on:
  push:
    branches: [main, develop]
  pull_request:

# Least privilege; a newer push to the same branch or PR cancels the older run.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Precompiled tsgo module, kept across runs (see README "Build caching").
  TSGO_CWASM_CACHE: .tsgo-cache

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-audit@0.22.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tsgo-cache
          key: tsgo-${{ runner.os }}-${{ hashFiles('build.rs', 'Cargo.lock') }}
      - run: cargo fmt --all --check
      # Upstream code carries existing clippy warnings that we do not rewrite (AGENTS.md §5):
      # warnings are reported, errors fail the build.
      - run: cargo clippy --all-targets --locked
      - run: node --test scripts/check-rust-coverage.test.mjs
      - run: node --test scripts/candidate-release.test.mjs
      # tests/it starts MinIO and Azurite containers; GitHub runners provide Docker.
      - run: mkdir -p coverage && cargo llvm-cov --workspace --locked --json --output-path coverage/rust.json
        env:
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
          CARGO_BUILD_JOBS: '2'
      - run: node scripts/check-rust-coverage.mjs coverage/rust.json scripts/rust-coverage.json
      - run: cargo audit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: runtime-coverage
          path: coverage/rust.json
          retention-days: 7
      # Studio builds the connectors crate without its `live` feature (mock mode only).
      - run: cargo clippy -p donka-connectors --all-targets --locked -- -D warnings
      - run: cargo test -p donka-connectors --locked

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          outputs: type=oci,dest=${{ runner.temp }}/runtime-image,tar=false
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.1
          input: ${{ runner.temp }}/runtime-image
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
